name: benchmark

# What the tunnel costs, measured on one machine: the client, the core and
# the target all live here, so the number is the core's own capacity and
# nothing else. It is the same shape as the measurement the Clash kernel
# publishes.
#
# Two stacks are measured the same way, in the same run: the one the releases
# carry and the go stack. The ratio is the question; either number alone is
# not.
#
# The verdict is the median of 9 measured transfers, after one discarded
# warm-up transfer. Best-of-three used to be reported, but the first three
# legacy runs rose monotonically while the go stack's did not, so best was
# measuring cache warm-up rather than the stack. Every run also prints cv and
# spread; a run whose own cv exceeds 5% is flagged unstable and must not be
# used to settle the ratio.
#
# The payload defaults to 512 MiB. At 64 MiB a transfer lasts only 50-96 ms,
# so scheduler jitter on a shared runner dominates the result: the first
# measurement with 9 runs still produced cv 4.9-17.7% and spread up to 71%.
# A longer transfer does not remove the noise, but it shrinks its share of
# the measured time. Size, runs and warm-up are dispatch inputs so the
# baseline can be tuned without another commit.
#
# The run needs the tunnel device, and the device and its routes are the
# system's, so it runs as root.

on:
  push:
    branches:
      - skyward
  workflow_dispatch:
    inputs:
      size:
        description: 'payload size in MiB; longer transfers shrink scheduler noise'
        required: false
        default: '512'
        type: string
      runs:
        description: 'measured transfers per stack (warm-up excluded)'
        required: false
        default: '9'
        type: string
      warmup:
        description: 'unmeasured transfers discarded before the first run'
        required: false
        default: '1'
        type: string

concurrency:
  group: benchmark-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GO_VERSION: '1.27.1'
  # inputs is empty on push, so the defaults apply to every automatic run.
  BENCH_SIZE: ${{ inputs.size || '512' }}
  BENCH_RUNS: ${{ inputs.runs || '9' }}
  BENCH_WARMUP: ${{ inputs.warmup || '1' }}

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: go.sum
      - name: Build both cores
        env:
          CGO_ENABLED: 0
        run: |
          go build -tags with_gvisor -o "$RUNNER_TEMP/core-legacy" .
          go build -tags "with_gvisor,with_go_stack" -o "$RUNNER_TEMP/core-go" .
      # The relay path needs no tunnel device; the tunnel path does, and
      # the tunnel is brought up the way the application brings it up.
      - name: Build the tunnel benchmark
        run: go build -tags "with_gvisor,with_go_stack" -o "$RUNNER_TEMP/bench-tun" ./bench/tun
      - name: Measure the relay path
        run: |
          set -euo pipefail
          for v in BENCH_SIZE BENCH_RUNS BENCH_WARMUP; do
            [[ -n "${!v}" ]] || { echo "::error::$v is empty; check the dispatch inputs"; exit 2; }
          done
          for stack in legacy go; do
            echo "=== the $stack stack, through the inbound ==="
            sudo bash bench/tunnel_bench.sh \
              --core "$RUNNER_TEMP/core-$stack" \
              --mode proxy --stack "$stack" \
              --size "$BENCH_SIZE" --runs "$BENCH_RUNS" --warmup "$BENCH_WARMUP" \
              | tee "$RUNNER_TEMP/$stack.log"
          done
      - name: Measure the tunnel path
        run: |
          set -euo pipefail
          for stack in legacy go; do
            echo "=== the $stack stack, through the tunnel ==="
            sudo "$RUNNER_TEMP/bench-tun" -config "bench/tun/$stack.yaml" \
              -runs "$BENCH_RUNS" -warmup "$BENCH_WARMUP" -size "$BENCH_SIZE" \
              | tee "$RUNNER_TEMP/tun-$stack.log"
          done
      # Turn the four logs into a verdict. Without this, "is there an
      # improvement?" requires downloading artifacts and doing the arithmetic
      # by hand, which is how a noisy run gets mistaken for a result.
      - name: Compare the stacks
        if: always()
        run: |
          python3 - <<'PY'
          import os, re, pathlib

          tmp = pathlib.Path(os.environ["RUNNER_TEMP"])

          def parse(name):
              path = tmp / f"{name}.log"
              if not path.exists():
                  return None
              text = path.read_text()
              def grab(pattern):
                  m = re.search(pattern, text, re.M)
                  return float(m.group(1)) if m else None
              return {
                  "median": grab(r"^median:\s+([\d.]+)"),
                  "cv": grab(r"cv\s+([\d.]+)%"),
                  "size": grab(r"size=(\d+)MiB"),
                  "stable": "stable: yes" in text,
              }

          rows = ["| path | legacy median | go median | go/legacy | cv legacy / go | verdict |",
                  "| --- | ---: | ---: | ---: | ---: | --- |"]
          any_unstable = False
          for label, legacy_name, go_name in (("relay", "legacy", "go"),
                                              ("tunnel", "tun-legacy", "tun-go")):
              legacy, go = parse(legacy_name), parse(go_name)
              if not legacy or not go or not legacy["median"] or not go["median"]:
                  rows.append(f"| {label} | — | — | — | — | logs missing |")
                  any_unstable = True
                  continue
              ratio = go["median"] / legacy["median"]
              unstable = not (legacy["stable"] and go["stable"])
              any_unstable |= unstable
              cv_l = legacy["cv"] if legacy["cv"] is not None else float("nan")
              cv_g = go["cv"] if go["cv"] is not None else float("nan")
              cv = f"{cv_l:.1f}% / {cv_g:.1f}%"
              if unstable:
                  verdict = "UNSTABLE — re-run, do not use this ratio"
              elif ratio >= 2.0:
                  verdict = f"{ratio:.2f}x — meets the P4 2x gate"
              elif ratio >= 1.5:
                  verdict = f"{ratio:.2f}x — above the R6 stop line, below P4"
              else:
                  verdict = f"{ratio:.2f}x — below 1.5x, R6 says stop and profile"
              rows.append(f'| {label} | {legacy["median"]:.1f} | {go["median"]:.1f} | '
                          f'{ratio:.3f} | {cv} | {verdict} |')

          sizes = set()
          for name in ("legacy", "go", "tun-legacy", "tun-go"):
              p = parse(name)
              if p and p["size"]:
                  sizes.add(p["size"])
          rows.append("")
          if sizes:
              rows.append("payload: " + ", ".join(f"{s:.0f} MiB" for s in sorted(sizes))
                          + " per transfer")
          rows.append("P0 gate: both stacks must report `stable: yes` (cv <= 5%).")
          rows.append("P4 gate: >= 2x to consider switching the default; R6: < 1.5x means stop and profile.")
          if any_unstable:
              rows.append("**This run cannot settle the ratio.** A shared runner is not a quiet machine; "
                          "fix the baseline before drawing conclusions.")
          report = "\n".join(rows)
          print(report)
          summary = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary:
              with open(summary, "a") as f:
                  f.write("## Stack comparison\n\n" + report + "\n")
          PY
      - name: Attach the numbers
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: tunnel-benchmark
          path: |
            ${{ runner.temp }}/*.log
