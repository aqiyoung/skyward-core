# skyward-core (Rust) — mihomo-compatible configuration subset.
# Copy to config.yaml and run: cargo run --release -- -c config.yaml

# Plain HTTP proxy port.
port: 7890
# SOCKS5 proxy port.
socks-port: 7891
# Combined HTTP + SOCKS5 port.
# mixed-port: 7892

allow-lan: false
mode: rule
log-level: info

# External REST controller.
external-controller: 127.0.0.1:9090
# secret: "change-me"

dns:
  enable: true
  enhanced-mode: redir-host
  nameserver:
    - 223.5.5.5
    - 8.8.8.8

# Only DIRECT and REJECT terminate connections in this slice.
# Other protocol types are parsed and shown in /proxies, but connecting through
# them returns a clear "not implemented" error.
proxies:
  - name: "ss-demo"
    type: ss
    server: example.com
    port: 8388
    cipher: aes-256-gcm
    password: "password"

proxy-groups:
  - name: "auto"
    type: url-test
    proxies:
      - DIRECT
      - ss-demo
    url: "http://www.gstatic.com/generate_204"
    interval: 300

rules:
  - DOMAIN-SUFFIX,localhost,DIRECT
  - DOMAIN-SUFFIX,127.0.0.1,DIRECT
  - DOMAIN-KEYWORD,ads,REJECT
  - IP-CIDR,10.0.0.0/8,DIRECT
  - IP-CIDR,192.168.0.0/16,DIRECT
  - MATCH,DIRECT
