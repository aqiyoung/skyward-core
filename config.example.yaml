# skyward-core (Rust) — mihomo-compatible configuration subset.
# Copy to config.yaml and run: cargo run --release -- -c config.yaml

# Plain HTTP proxy port.
port: 7890
# SOCKS5 proxy port.
socks-port: 7891
# Combined HTTP + SOCKS5 port.
# mixed-port: 7892

allow-lan: false
mode: rule
log-level: info

# External REST controller.
external-controller: 127.0.0.1:9090
# secret: "change-me"

dns:
  enable: true
  enhanced-mode: redir-host
  nameserver:
    - 223.5.5.5
    - 8.8.8.8

# Only DIRECT and REJECT terminate connections in this slice.
# Other protocol types are parsed and shown in /proxies, but connecting through
# them returns a clear "not implemented" error.
proxies:
  - name: "ss-demo"
    type: ss
    server: example.com
    port: 8388
    cipher: aes-256-gcm
    password: "password"
  - name: "trojan-demo"
    type: trojan
    server: example.com
    port: 443
    password: "password"
    # sni: example.com   # defaults to `server`
  - name: "vless-demo"
    type: vless
    server: example.com
    port: 443
    uuid: b831381d-6324-4d53-ad4f-8cda48b30811
    tls: true
    # server-name: example.com   # SNI override, defaults to `server`
  - name: "vmess-demo"
    type: vmess
    server: example.com
    port: 443
    uuid: b831381d-6324-4d53-ad4f-8cda48b30811
    cipher: auto          # aes-128-gcm / chacha20-poly1305
    tls: true
  - name: "http-demo"
    type: http
    server: proxy.example.com
    port: 8080
    # username: user
    # password: pass
  - name: "socks5-demo"
    type: socks5
    server: proxy.example.com
    port: 1080
    # username: user
    # password: pass

proxy-groups:
  - name: "auto"
    type: url-test
    proxies:
      - DIRECT
      - ss-demo
    url: "http://www.gstatic.com/generate_204"
    interval: 300

rule-providers:
  # Inline providers need no external file.
  ads-inline:
    type: inline
    behavior: domain
    payload:
      - ads.example.com
      - tracker.example.net
  # file/http providers read a yaml (payload:) or text payload.
  # remote-ads:
  #   type: http
  #   behavior: classical
  #   format: yaml
  #   url: https://example.com/ruleset.yaml
  #   path: ./rulesets/remote-ads.yaml
  #   interval: 86400

rules:
  - RULE-SET,ads-inline,REJECT
  # GEOIP/GEOSITE read geoip.dat / geosite.dat from the config directory.
  - GEOSITE,cn,DIRECT
  - GEOIP,lan,DIRECT
  - GEOIP,private,DIRECT
  - DOMAIN-REGEX,^ads[0-9]+\.example\.com$,REJECT
  - DOMAIN-KEYWORD,ads,REJECT
  - DOMAIN-SUFFIX,localhost,DIRECT
  - IP-CIDR,10.0.0.0/8,DIRECT
  - IP-CIDR,192.168.0.0/16,DIRECT
  - MATCH,DIRECT
