[package]
name = "skyward-core"
version = "0.1.0"
edition = "2021"
description = "Rust rewrite of the skyward proxy kernel (mihomo-compatible core)"
license = "GPL-3.0-only"

[lib]
name = "skyward_core"
crate-type = ["rlib", "cdylib"]

[dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1"
hyper = { version = "0.14", features = ["full"] }
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls", "ring"] }
blake2 = "0.10"
rand_core = { version = "0.6", features = ["getrandom"] }
async-trait = "0.1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
regex = "1"
ipnet = "2"
aes-gcm = "0.10"
chacha20poly1305 = "0.10"
md-5 = "0.10"
hmac = "0.12"
sha1 = "0.10"
rand = "0.8"
sha2 = "0.10"
# ring backend: pure Rust + C, cross-compiles cleanly to aarch64-linux-android
# without aws-lc-rs's cmake/go toolchain requirement.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
webpki-roots = "0.26"
aes = "0.8"
crc32fast = "1"
base64 = "0.21"
bytes = "1"
x25519-dalek = { version = "2", features = ["static_secrets"] }
# Pure-Rust zstd decoder for MRS rule-set files (no C toolchain in the
# Android cross build).
ruzstd = "0.8"
ml-kem = "0.2"
libc = "0.2"
argon2 = "0.5"
chacha20 = "0.9"
jni = "0.21"
smoltcp = { version = "0.11", default-features = false, features = ["std", "medium-ip", "proto-ipv4", "socket-tcp", "socket-udp", "socket-icmp"] }
age = { version = "0.12.1", default-features = false, features = ["armor"] }
